<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SPIKE Pi - Master Edition (Bluetooth)</title>
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/python_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/en.js"></script>
  
  <style>
    :root { --spike-yellow: #FFD500; --spike-dark: #231F20; --spike-green: #00A95C; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: var(--spike-dark); color: white; }
    header { background: var(--spike-yellow); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; color: black; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    #main { display: flex; flex: 1; overflow: hidden; background: #f0f0f0; }
    #blocklyDiv { flex: 2; border-right: 2px solid #ccc; }
    #sidePanel { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; }
    #codeContainer { flex: 1; padding: 15px; overflow: auto; font-family: 'Consolas', monospace; font-size: 14px; color: #d4d4d4; }
    #console { height: 150px; background: #000; padding: 10px; border-top: 2px solid #444; color: #0f0; font-family: monospace; overflow-y: auto; }
    .controls { display: flex; gap: 10px; align-items: center; }
    .btn { cursor: pointer; padding: 10px 20px; border: none; border-radius: 20px; font-weight: bold; text-transform: uppercase; }
    .btn-run { background: var(--spike-green); color: white; }
    .btn-stop { background: #E30613; color: white; }
    .btn-conn { background: #007bff; color: white; }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

<header>
  <div style="display: flex; align-items: center; gap: 15px;">
    <div style="font-size: 1.8em; font-weight: 900;">SPIKE <span style="font-weight: 100;">Pi</span></div>
  </div>
  <div class="controls">
    <button id="btnConnect" class="btn btn-conn" onclick="conectarBluetooth()">🔗 Connect Pi</button>
    <button class="btn btn-run" onclick="enviarAPi()">▶ Run</button>
    <button class="btn btn-stop" onclick="detenerRobot()">■ Stop</button>
  </div>
</header>

<div id="main">
  <div id="blocklyDiv"></div>
  <div id="sidePanel">
    <div id="codeContainer">
      <div style="color:var(--spike-yellow)">// PYTHON CODE (Librería Spike Pro)</div>
      <pre id="pythonCode"></pre>
    </div>
    <div id="console">> System ready... Connect via Bluetooth.</div>
  </div>
</div>

<xml id="toolbox" style="display: none">
  <category name="Movement" colour="230">
    <block type="motores_dual"><field name="SPEED">10</field></block>
    <block type="motores_giro"></block>
    <block type="motor_individual"></block>
    <block type="motor_stop"></block>
    <block type="leer_vueltas"></block>
    <block type="reset_motor"></block>
  </category>
  <category name="Sensors" colour="60">
    <block type="sensor_distancia"></block>
    <block type="esperar_distancia"></block>
  </category>
  <category name="Control" colour="120">
    <block type="base_delay"></block>
    <block type="controls_repeat_ext"><value name="TIMES"><shadow type="math_number"><field name="NUM">3</field></shadow></value></block>
    <block type="controls_if"></block>
    <block type="controls_whileUntil"></block>
  </category>
  <category name="Display" colour="300">
    <block type="print_console"></block>
    <block type="text"></block>
  </category>
  <category name="Variables" colour="330" custom="VARIABLE"></category>
</xml>

<script>
/* --- 1. DEFINICIÓN DE BLOQUES --- */
Blockly.defineBlocksWithJsonArray([
  {
    "type": "motor_individual",
    "message0": "Motor %1 turn %2 at speed %3 for %4 %5",
    "args0": [
      { "type": "field_dropdown", "name": "ID", "options": [["A","0"], ["B","1"]] },
      { "type": "field_dropdown", "name": "DIR", "options": [["forward","forward"], ["backward","backward"]] },
      { "type": "field_number", "name": "SPEED", "value": 5, "min": 1, "max": 10 },
      { "type": "field_number", "name": "VALOR", "value": 1 },
      { "type": "field_dropdown", "name": "MODO", "options": [["rotations","VUELTAS"], ["seconds","SEG"]] }
    ],
    "previousStatement": null, "nextStatement": null, "colour": 230
  },
  {
    "type": "motores_dual",
    "message0": "Move A+B %1 at speed %2 for %3 %4",
    "args0": [
      { "type": "field_dropdown", "name": "DIR", "options": [["forward","forward"], ["backward","backward"]] },
      { "type": "field_number", "name": "SPEED", "value": 10, "min": 1, "max": 10 },
      { "type": "field_number", "name": "VALOR", "value": 4 },
      { "type": "field_dropdown", "name": "MODO", "options": [["rotations","VUELTAS"], ["seconds","SEG"]] }
    ],
    "previousStatement": null, "nextStatement": null, "colour": 230
  },
  {
    "type": "motores_giro",
    "message0": "Turn %1 %2 degrees (speed: %3)",
    "args0": [
      { "type": "field_dropdown", "name": "SENTIDO", "options": [["Right","derecha"], ["Left","izquierda"]] },
      { "type": "field_number", "name": "GRADOS", "value": 90 },
      { "type": "field_number", "name": "SPEED", "value": 10, "min": 1, "max": 10 }
    ],
    "previousStatement": null, "nextStatement": null, "colour": 230
  },
  { "type": "motor_stop", "message0": "Stop Movement", "previousStatement": null, "nextStatement": null, "colour": 230 },
  
  // NUEVOS BLOQUES DE ENCODERS
  { "type": "leer_vueltas", "message0": "Motor %1 rotations", "args0": [{ "type": "field_dropdown", "name": "ID", "options": [["A","0"], ["B","1"]] }], "output": "Number", "colour": 230 },
  { "type": "reset_motor", "message0": "Reset Motor %1", "args0": [{ "type": "field_dropdown", "name": "ID", "options": [["A","0"], ["B","1"]] }], "previousStatement": null, "nextStatement": null, "colour": 230 },
  
  // SENSORES Y CONTROL
  { "type": "sensor_distancia", "message0": "distance (cm)", "output": "Number", "colour": 60 },
  { "type": "esperar_distancia", "message0": "wait until distance < %1 cm", "args0": [{ "type": "field_number", "name": "DIST", "value": 10 }], "previousStatement": null, "nextStatement": null, "colour": 60 },
  { "type": "base_delay", "message0": "wait %1 sec", "args0": [{ "type": "field_number", "name": "SEC", "value": 1 }], "previousStatement": null, "nextStatement": null, "colour": 120 },
  
  // BLOQUE PRINT MEJORADO (Ahora acepta conectar otros bloques redondos dentro)
  { "type": "print_console", "message0": "print %1", "args0": [{ "type": "input_value", "name": "TEXT" }], "previousStatement": null, "nextStatement": null, "colour": 300 }
]);

/* --- 2. TRADUCCIÓN A PYTHON --- */
const pyGen = Blockly.Python;

pyGen.forBlock['motor_individual'] = function(block) { return `robot_motor_maestro(${block.getFieldValue('ID')}, '${block.getFieldValue('DIR')}', ${block.getFieldValue('VALOR')}, '${block.getFieldValue('MODO')}', ${block.getFieldValue('SPEED')})\n`; };
pyGen.forBlock['motores_dual'] = function(block) { return `robot_dual_maestro('${block.getFieldValue('DIR')}', ${block.getFieldValue('VALOR')}, '${block.getFieldValue('MODO')}', ${block.getFieldValue('SPEED')})\n`; };
pyGen.forBlock['motores_giro'] = function(block) { return `robot_girar_maestro('${block.getFieldValue('SENTIDO')}', ${block.getFieldValue('GRADOS')}, ${block.getFieldValue('SPEED')})\n`; };
pyGen.forBlock['motor_stop'] = function() { return "apagar_todo()\n"; };
pyGen.forBlock['base_delay'] = function(block) { return `time.sleep(${block.getFieldValue('SEC')})\n`; };
pyGen.forBlock['sensor_distancia'] = function() { return ["get_distancia()", pyGen.ORDER_ATOMIC]; };
pyGen.forBlock['esperar_distancia'] = function(block) { return `while get_distancia() > ${block.getFieldValue('DIST')}: time.sleep(0.05)\n`; };

// NUEVAS TRADUCCIONES DE ENCODERS
pyGen.forBlock['leer_vueltas'] = function(block) { return [`motor_vueltas(${block.getFieldValue('ID')})`, pyGen.ORDER_ATOMIC]; };
pyGen.forBlock['reset_motor'] = function(block) { return `reset_motor(${block.getFieldValue('ID')})\n`; };

// TRADUCCIÓN PRINT MEJORADO
pyGen.forBlock['print_console'] = function(block) { 
  let msg = pyGen.valueToCode(block, 'TEXT', pyGen.ORDER_NONE) || '""';
  return `print(${msg})\n`; 
};

/* --- 3. INYECTAR BLOCKLY Y ACTUALIZAR CÓDIGO --- */
const workspace = Blockly.inject('blocklyDiv', { toolbox: document.getElementById('toolbox'), zoom: { controls: true, wheel: true }, trashcan: true });

function updateCode() {
  // Ahora el Header es super corto porque todo el código gordo está en la Pi
  let header = `from spike_pro import *\n\ntry:\n`;
  
  let body = pyGen.workspaceToCode(workspace);
  body = !body.trim() ? "    pass\n" : body.split('\n').map(l => l.trim() ? "    " + l : "").join('\n');
  
  let footer = `\nfinally:\n    apagar_todo()\n    print("FINISHED")`;
  
  document.getElementById('pythonCode').innerText = header + body + footer;
}

workspace.addChangeListener(updateCode);
updateCode();

/* --- 4. COMUNICACIÓN BLUETOOTH (CHUNKS) --- */
let bleCharacteristic = null;
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

async function conectarBluetooth() {
  try {
    log("Searching for SpikePi...");
    const bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'SpikePi' }],
      optionalServices: [SERVICE_UUID]
    });

    log("Connecting to GATT server...");
    const server = await bleDevice.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    bleCharacteristic = await service.getCharacteristic(RX_UUID);
    
    document.getElementById('btnConnect').innerText = "✅ Connected";
    document.getElementById('btnConnect').style.background = "var(--spike-green)";
    log("Bluetooth Connected Successfully!");
  } catch (error) {
    log("Error connecting: " + error);
  }
}

async function enviarAPi() {
  if (!bleCharacteristic) {
    alert("Please connect to Bluetooth first!");
    return;
  }
  
  const code = document.getElementById('pythonCode').innerText;
  const encoder = new TextEncoder();
  
  try {
    log("Sending clean code via BLE...");
    
    await bleCharacteristic.writeValue(encoder.encode("==START=="));
    
    const chunkSize = 150;
    for (let i = 0; i < code.length; i += chunkSize) {
      const chunk = code.substring(i, i + chunkSize);
      await bleCharacteristic.writeValue(encoder.encode(chunk));
      await new Promise(resolve => setTimeout(resolve, 40));
    }
    
    await bleCharacteristic.writeValue(encoder.encode("==END=="));
    log("Code executed!");
  } catch (e) {
    log("Send error: " + e);
  }
}

async function detenerRobot() {
  if (bleCharacteristic) {
    const encoder = new TextEncoder();
    await bleCharacteristic.writeValue(encoder.encode("STOP"));
    log("Stop command sent.");
  }
}

function log(msg) {
  const con = document.getElementById('console');
  con.innerHTML += `<div>> ${msg}</div>`;
  con.scrollTop = con.scrollHeight;
}
</script>
</body>
</html>
